<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var _origFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() { return _origFetch; },
            set: function(val) { _origFetch = val; }
          });
        } catch (e) {}

        window.addEventListener('error', function(event) {
          if (event && event.filename && (event.filename.indexOf('chrome-extension://') !== -1 || event.filename.indexOf('moz-extension://') !== -1)) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);
      })();
    </script>
    <title>REDROOM — Premium Digital Marketplace</title>
    <meta name="description" content="Premium customer-facing marketplace for digital cards, prepaid solutions, and secure online accounts with real-time balance, instant delivery, and crypto deposits." />

    <meta property="og:description" content="Premium customer-facing marketplace for digital cards, prepaid solutions, and secure online accounts with real-time balance, instant delivery, and crypto deposits." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</html>
